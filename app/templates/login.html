{% extends "base.html" %}

{% block title %}SigNet - Secure Login{% endblock %}

{% block footer %}{% endblock %}

{% block content %}
<div class="auth-container">
    <div class="logo-container" style="justify-content: center; font-size: 2.2rem; margin-bottom: 0.5rem; pointer-events: none;">
        <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
            stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path>
        </svg>
        SigNet
    </div>
    <h2>Secure Login</h2>
    
    <form action="{{ url_for('login') }}" method="POST">
        <div class="form-group">
            <label for="email">Email Address</label>
            <input type="email" id="email" name="email" placeholder="john@example.com" required>
        </div>
        <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" name="password" placeholder="••••••••" required>
        </div>
        <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 1rem;">Log In</button>
    </form>
    
    <div class="auth-footer">
        Don't have an account? <a href="{{ url_for('register') }}">Sign Up</a>
    </div>
</div>
{% endblock %}
